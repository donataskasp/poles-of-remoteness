# Builds the pipeline container (pipeline/Dockerfile) and runs the pytest suite
# inside it, so CI exercises the same image as the laptop and any rented box.
# The tests need osmium, the GDAL CLI tools and pmtiles, which the image carries.
# No secrets, no deploy: this workflow only builds and tests.
name: pipeline-tests

on:
  push:
    paths:
      - "pipeline/**"
      - "docs/**"
      - "CLAUDE.md"
      - "README.md"
      - ".github/workflows/pipeline-tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "docs/**"
      - "CLAUDE.md"
      - "README.md"
      - ".github/workflows/pipeline-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the pipeline image
        uses: docker/build-push-action@v7
        with:
          context: pipeline
          tags: poles:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The checkout is mounted read-only and named by POLES_REPO_ROOT so tests/test_docs_pins.py can
      # read the docs, which the image does not carry (build context is pipeline/). Without it those
      # tests would skip and a drifted doc would reach main unnoticed.
      - name: Run the pipeline tests in the image
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" -e POLES_REPO_ROOT=/repo --entrypoint pytest poles:ci -q /app/tests
