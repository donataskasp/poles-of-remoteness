name: Deploy to Cloudflare

on:
  push:
    branches: [main, europe]
    paths:
      - 'site/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # main deploys production, europe deploys the preview worker (wrangler env "preview")
  PREVIEW: ${{ github.ref_name == 'europe' }}
  LIVE_URL: ${{ github.ref_name == 'europe' && 'https://atokiausia-lietuva-preview.donatas-kasparavicius.workers.dev' || 'https://atokiausia-lietuva.donatas-kasparavicius.workers.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"; exit 1
          fi
      - name: Write version.json
        run: |
          printf '{"commit": "%s", "built_at": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/version.json
          cat site/version.json
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.124.0'
          command: deploy ${{ github.ref_name == 'europe' && '--env preview' || '' }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the new version
        run: |
          for i in $(seq 1 18); do
            if [ "$PREVIEW" = "true" ]; then
              got=$(curl -fsS "$LIVE_URL/version.json?ci=$GITHUB_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' || true)
              if [ "$got" = "$GITHUB_SHA" ]; then echo "version.json carries $GITHUB_SHA"; exit 0; fi
            else
              if curl -fsS "$LIVE_URL/?ci=$GITHUB_SHA" | grep -q "Atokiausia Lietuva"; then echo "live page answers"; exit 0; fi
            fi
            echo "attempt $i: not yet"; sleep 10
          done
          echo "the deployed site did not show the new version"; exit 1
      - name: First-screen budget (preview only)
        if: env.PREVIEW == 'true'
        run: |
          # Everything the first screen fetches before it is interactive, compressed bytes as the browser gets them.
          # Keep this list in step with index.html; the data files are the region list and the opening region's units.
          FIRST_SCREEN="/europe/lt /css/app.css /vendor/leaflet/leaflet.css /vendor/leaflet/leaflet.js /vendor/pmtiles/pmtiles.js /js/app.js /js/i18n.js /js/router.js /js/data.js /js/palette.js /js/readout.js /js/map.js /js/explore.js /js/detail.js /js/markers.js /js/card.js /js/ranking.js /js/classes.js /data/regions.json /data/europe/units.json /data/europe/units/lt.json"
          total=0
          for p in $FIRST_SCREEN; do
            n=$(curl -sS --compressed -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: gzip, br' "$LIVE_URL$p?ci=$GITHUB_SHA")
            echo "$n $p"; total=$((total + n))
          done
          echo "first screen: $total compressed bytes (budget 256000)"
          [ "$total" -le 256000 ]
