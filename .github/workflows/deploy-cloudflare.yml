name: Deploy to Cloudflare

on:
  push:
    branches: [main, europe]
    paths:
      - 'site/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # main deploys production, anything else deploys the preview worker (wrangler env "preview").
  # Fail closed on the branch test: an empty string is falsy in GitHub expressions, so the
  # inverted form (== 'main' && '' || '--env preview') would silently deploy the preview on main.
  # Test for "not main" instead, which also routes a workflow_dispatch from a third branch to the
  # preview rather than to production.
  PREVIEW: ${{ github.ref_name != 'main' }}
  LIVE_URL: ${{ github.ref_name != 'main' && 'https://atokiausia-lietuva-preview.donatas-kasparavicius.workers.dev' || 'https://atokiausia-lietuva.donatas-kasparavicius.workers.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials are present
        # Secrets reach the script as environment variables, never interpolated into the body.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing repo secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID. Add with: gh secret set <NAME>"
            exit 1
          fi
      - name: Write version.json
        run: |
          printf '{"commit": "%s", "built_at": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/version.json
          cat site/version.json
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.124.0'
          command: deploy ${{ github.ref_name != 'main' && '--env preview' || '' }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the new version
        # Both targets stamp site/version.json at deploy, so both are verified the same way:
        # this commit is live, not merely some version of the site.
        run: |
          for i in $(seq 1 18); do
            got=$(curl -fsS --max-time 20 "$LIVE_URL/version.json?ci=$GITHUB_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "version.json carries $GITHUB_SHA"; exit 0; fi
            echo "attempt $i: not yet"; sleep 10
          done
          echo "the deployed site did not show the new version"; exit 1
      - name: First-screen budget (preview only)
        if: env.PREVIEW == 'true'
        env:
          # Flip to '1' once site/data/ carries the region JSON (after the R2 rerun). Until then a
          # .json entry answered as HTML is the SPA fallback for a file that is not published yet,
          # so it is reported and left out of the total instead of failing the run.
          JSON_STRICT: '1'
        run: |
          # Everything the first screen fetches before it is interactive, compressed bytes as the browser gets them.
          # Keep this list in step with index.html; the data files are the region list and the opening region's units.
          # The region and unit ids here name the run of record, not a precedent: code never names a region.
          FIRST_SCREEN="/europe/lt /css/app.css /vendor/leaflet/leaflet.css /vendor/leaflet/leaflet.js /vendor/pmtiles/pmtiles.js /js/app.js /js/i18n.js /js/router.js /js/data.js /js/palette.js /js/readout.js /js/map.js /js/explore.js /js/detail.js /js/markers.js /js/card.js /js/ranking.js /js/classes.js /data/regions.json /data/europe/units.json /data/europe/units/lt.json"
          total=0
          missing=0
          for p in $FIRST_SCREEN; do
            # A static asset answered as HTML is the SPA fallback, which means the file is absent:
            # it would weigh nothing here and break the page at runtime. The /europe/lt entry is the
            # page itself and is HTML by design, so only the extensions below are content checked.
            # The new worker version reaches the edges over a few seconds, and the version check above can be
            # answered by one edge while this fetch lands on another still serving the previous version (seen
            # 2026-08-23: a module new in that version answered 404 for about 40 s). A 404, or an SPA fallback
            # for a .js or .css, is retried for up to a minute before it counts as missing.
            for attempt in 1 2 3 4 5 6; do
              out=$(curl -sS --compressed --max-time 20 -o /dev/null -w '%{http_code} %{size_download} %{content_type}' "$LIVE_URL$p?ci=$GITHUB_SHA-$attempt") \
                || { echo "::error::first-screen fetch failed: $p"; exit 1; }
              code=${out%% *}
              rest=${out#* }
              n=${rest%% *}
              ct=${rest#* }
              case "$code:$p:$ct" in
                404:*|200:*.js:text/html*|200:*.css:text/html*)
                  if [ "$attempt" -lt 6 ]; then echo "attempt $attempt: $p not there yet (HTTP $code, $ct), retrying"; sleep 10; fi ;;
                *) break ;;
              esac
            done
            if [ "$code" != 200 ]; then echo "MISSING (HTTP $code): $p"; missing=1; continue; fi
            case "$p:$ct" in
              *.js:text/html*|*.css:text/html*)
                echo "MISSING (SPA fallback): $p"; missing=1; continue ;;
              *.json:text/html*)
                if [ "$JSON_STRICT" = '1' ]; then
                  echo "MISSING (SPA fallback): $p"; missing=1
                else
                  echo "not published yet: $p"
                fi
                continue ;;
            esac
            echo "$n $p"; total=$((total + n))
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::first-screen assets are missing from the deploy (see the lines above)"; exit 1
          fi
          echo "first screen: $total compressed bytes (budget 256000)"
          [ "$total" -le 256000 ]
