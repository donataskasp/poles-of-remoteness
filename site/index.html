<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atokiausia Lietuva</title>
<meta name="description" content="Interaktyvus žemėlapis: toliausiai nuo bet kokio kelio nutolusios Lietuvos vietos, apskaičiuotos iš OpenStreetMap duomenų.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="hdr">
  <div class="hdr__brand">
    <h1 class="hdr__title">Atokiausia Lietuva</h1>
    <p class="hdr__sub" data-i18n="subtitle"></p>
  </div>

  <div class="hdr__center">
    <div class="seg" role="group" id="scenario-seg" data-i18n-aria="scenarioGroup">
      <button type="button" class="seg__btn" data-scenario="A" aria-pressed="true"></button>
      <button type="button" class="seg__btn" data-scenario="B" aria-pressed="false"></button>
    </div>
  </div>

  <div class="hdr__right">
    <div class="search" id="search">
      <label class="vh" for="q" data-i18n="searchLabel"></label>
      <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="q-list" aria-autocomplete="list">
      <button type="button" class="search__clear" id="q-clear" hidden data-i18n-aria="clear">&times;</button>
      <ul class="search__list" id="q-list" role="listbox" hidden></ul>
    </div>

    <div class="seg seg--lang" role="group" id="lang-seg" data-i18n-aria="langGroup">
      <button type="button" class="seg__btn" data-lang="lt" aria-pressed="true" lang="lt">LT</button>
      <button type="button" class="seg__btn" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </div>
</header>

<main class="stage">
  <div id="map"></div>

  <aside class="panel" id="panel" aria-label="Info">
    <button type="button" class="panel__handle" id="panel-handle" aria-expanded="true" aria-controls="panel-body">
      <span class="panel__grip" aria-hidden="true"></span>
      <span class="vh" data-i18n="togglePanel"></span>
    </button>

    <div class="panel__body" id="panel-body">
      <section class="card readout" id="readout" hidden aria-live="polite"></section>

      <section class="block" id="spots-block">
        <h2 class="block__h" data-i18n="spotsHeading"></h2>
        <p class="block__note" id="spots-note"></p>
        <ol class="spots" id="spots"></ol>
      </section>

      <section class="block">
        <h2 class="block__h" data-i18n="layersHeading"></h2>

        <div class="row">
          <span class="row__label" data-i18n="basemapLabel"></span>
          <div class="seg seg--sm" role="group" id="basemap-seg" data-i18n-aria="basemapLabel">
            <button type="button" class="seg__btn" data-base="osm" aria-pressed="true" data-i18n="baseOsm"></button>
            <button type="button" class="seg__btn" data-base="sat" aria-pressed="false" data-i18n="baseSat"></button>
          </div>
        </div>

        <div class="row row--check">
          <input type="checkbox" id="bands-toggle" checked>
          <label for="bands-toggle" data-i18n="bandsToggle"></label>
        </div>

        <p class="legend__intro" data-i18n="legendIntro"></p>
        <ul class="legend" id="legend"></ul>
      </section>

      <footer class="panel__foot">
        <button type="button" class="link-btn" id="about-btn" data-i18n="aboutBtn"></button>
      </footer>
    </div>
  </aside>
</main>

<dialog class="about" id="about">
  <form method="dialog" class="about__close-form">
    <button class="about__close" value="close" data-i18n-aria="close">&times;</button>
  </form>
  <h2 class="about__h" data-i18n="aboutTitle"></h2>
  <div class="about__body" id="about-body"></div>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
