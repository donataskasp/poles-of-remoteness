<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="title">Poles of remoteness</title>
<meta name="description" data-i18n-content="metaDescription" content="The places farthest from any road, computed from OpenStreetMap data.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr__brand">
    <h1 class="hdr__title"><a class="hdr__home" id="brand-home" href="/" data-i18n="title">Poles of remoteness</a></h1>
    <p class="hdr__sub" data-i18n="subtitle"></p>
  </div>
  <div class="hdr__right">
    <div class="seg seg--lang" role="group" id="lang-seg" data-i18n-aria="langGroup">
      <button type="button" class="seg__btn" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" class="seg__btn" data-lang="lt" aria-pressed="false" lang="lt">LT</button>
    </div>
  </div>
</header>

<main class="stage">
  <div id="map" class="map"></div>

  <!-- Task 6 and Task 8: the card -->
  <section class="card" id="card" hidden></section>

  <!-- Task 5: map controls and readout -->
  <div class="mapctl" id="mapctl">
    <div class="seg seg--sm" role="group" id="basemap-seg" data-i18n-aria="basemapLabel">
      <button type="button" class="seg__btn" data-base="sat" aria-pressed="true" data-i18n="baseSat"></button>
      <button type="button" class="seg__btn" data-base="osm" aria-pressed="false" data-i18n="baseOsm"></button>
    </div>
    <ul class="legend" id="legend" data-i18n-aria="legendLabel"></ul>
    <section class="readout" id="readout" hidden aria-live="polite"></section>
  </div>

  <!-- Task 7: the ranking -->
  <aside class="panel panel--collapsed" id="panel" data-i18n-aria="rankingTitle">
    <button type="button" class="panel__handle" id="panel-handle" aria-expanded="false" aria-controls="panel-body">
      <span class="panel__grip" aria-hidden="true"></span>
      <span class="panel__handle-text" data-i18n="rankingTitle"></span>
    </button>
    <div class="panel__body" id="panel-body">
      <p class="panel__note" id="ranking-note"></p>
      <ol class="ranking" id="ranking"></ol>
      <footer class="panel__foot">
        <button type="button" class="link-btn" id="about-btn" data-i18n="aboutBtn"></button>
      </footer>
    </div>
  </aside>
</main>

<!-- Task 8: About, both languages inline, toggled by html[lang] -->
<dialog class="about" id="about">
  <form method="dialog" class="about__close-form">
    <button class="about__close" value="close" data-i18n-aria="close">&times;</button>
  </form>
  <div class="about__body" id="about-body"></div>
</dialog>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/pmtiles/pmtiles.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
